<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ServiceNow CRM Overview</title>
  <style>
    :root {
      --fg: #1f2430; --muted: #6b7280; --border: #e5e7eb;
      --accent: #2b6cb0; --accent-soft: #ebf4fb; --bg: #fff;
    }
    html, body { margin: 0; padding: 0; }
    body {
      width: 300px;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    header { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    h1 { margin: 0; font-size: 13px; font-weight: 600; }
    main { padding: 10px 14px; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; flex-shrink: 0; }
    .status.supported .dot { background: #10b981; }
    .status.unsupported .dot { background: #f59e0b; }
    .label { color: var(--muted); font-size: 12px; }
    .value { font-weight: 500; }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    input[type="checkbox"] { margin: 0; }
    button {
      appearance: none; border: 1px solid var(--border); background: #fff;
      padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit;
      color: var(--fg);
    }
    button.primary { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    button:hover { background: var(--accent-soft); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .section { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .disabled { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <header><h1>ServiceNow CRM Overview</h1></header>
  <main>
    <div id="status" class="status">
      <span class="dot" aria-hidden="true"></span>
      <span class="value" id="statusText">Checking…</span>
    </div>
    <div class="hint" id="hint"></div>

    <div class="section" id="quickToggles">
      <div class="label" style="margin-bottom: 6px;">Quick toggles</div>
      <label class="row">
        <input type="checkbox" id="enabled">
        <span>Enable overview panel</span>
      </label>
      <label class="row">
        <input type="checkbox" id="expanded">
        <span>Start expanded</span>
      </label>
      <label class="row">
        <input type="checkbox" id="debug">
        <span>Debug logging</span>
      </label>
      <div class="actions">
        <button id="refresh">Refresh panel</button>
      </div>
    </div>

    <div class="section">
      <button id="openOptions" class="primary">Open settings</button>
    </div>
  </main>

  <script src="../shared/constants.js"></script>
  <script src="../shared/log.js"></script>
  <script src="../shared/url.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/messages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
